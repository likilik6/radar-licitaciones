# Radar de licitaciones — ejecución automática en GitHub Actions.
# Qué hace: todos los días baja los feeds y guarda las páginas (job «descargar»);
# de lunes a viernes, además, filtra, regenera la web y la publica con el método
# oficial de GitHub Pages (Actions) y pone al día el catálogo del Buscador. La
# persistencia (data/licitaciones.json) se sigue guardando con commit+push.

name: Radar de licitaciones

on:
  # Horario (26/11/2026): todos los días a las 4:07 UTC = 5:07 en España en invierno
  # y 6:07 en verano (GitHub usa UTC y no ajusta el cambio de hora). A esa hora ya
  # están los dos cortes del día de la Plataforma (estatal hacia las 20:20 del día
  # anterior, agregada hacia las 3:00).
  # OJO: es la hora a la que se PIDE, no a la que arranca. GitHub retrasa los
  # programados de este repo: con "0 6" el run se CREABA de 4 h 28 min a 6 h 23 min
  # tarde (22/09-02/10), y con "23 5", de 7 h 25 min a 10 h 46 min tarde (11/11-26/11),
  # empeorando. No es un paso lento: startedAt == createdAt, es la cola de GitHub.
  # Fuera del minuto 0, que es donde se junta todo el mundo.
  schedule:
    # Lunes a viernes: el Radar entero.
    - cron: "7 4 * * 1-5"
    # Sábado y domingo: SOLO «descargar» (las páginas para Radar Farma; no toca la
    # base ni la web). El resto sigue de lunes a viernes: el fin de semana es de
    # menores_autonomicos.yml y mantenimiento.yml, que cuentan con que no corre la
    # ingesta del catálogo (la base no aguanta las dos a la vez: 57014 del 21/09).
    # Si cambias esta línea, cambia igual la condición de «generar» y «catalogo».
    - cron: "7 4 * * 0,6"
  # Botón para lanzarlo a mano desde la pestaña "Actions" (útil para probar).
  workflow_dispatch:
    inputs:
      ejecutar_catalogo:
        description: "Ejecutar también el catálogo del Buscador (ingesta diaria + purga). Tarda 20-50 min y escribe en producción. Déjalo desmarcado para probar solo la publicación del Radar."
        type: boolean
        default: false
        required: false
      solo_paginas:
        description: "Solo bajar y guardar las páginas (job «descargar»), sin web ni catálogo: como el sábado y el domingo."
        type: boolean
        default: false
        required: false

# Concurrency recomendada por GitHub Pages: no cancelar un despliegue en curso.
concurrency:
  group: pages
  cancel-in-progress: false

# Correo de contacto del agente de usuario honesto (feeds.agente_de_usuario). Va en el
# secreto RADAR_CONTACTO, nunca en el repo, que es público.
env:
  RADAR_CONTACTO: ${{ secrets.RADAR_CONTACTO }}

jobs:
  # --- Job 0: baja los feeds UNA sola vez y guarda las páginas en bruto --------
  # Antes «generar» y «catalogo» bajaban cada uno los mismos feeds (unas 100
  # peticiones al día a la Plataforma). Ahora se bajan aquí una vez (643, 1044 y
  # 1143 de menores), con un solo intento por página y sin reintentos, y los dos
  # jobs las leen del artefacto. El artefacto «paginas-feed» se guarda 14 días:
  # Radar Farma lo usa para su base sin pedir nada más a la Plataforma.
  # Este job no falla si la Plataforma rechaza o corta (lo deja en el manifiesto):
  # el Radar se publica igual con lo que haya, como hasta ahora.
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Bajar los feeds (una sola vez)
        run: python descarga_paginas.py --salida paginas

      - name: Guardar las páginas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paginas-feed
          path: paginas
          retention-days: 14
          if-no-files-found: error

  # --- Job 1: genera la web, guarda el JSON y prepara el artefacto de Pages ---
  generar:
    needs: descargar
    # Corre aunque «descargar» falle por un error suyo: entonces lee en vivo, como antes.
    # No corre el sábado y el domingo (el cron "7 4 * * 0,6") ni con
    # «solo_paginas» marcado a mano.
    if: ${{ !cancelled() && github.event.schedule != '7 4 * * 0,6' && !inputs.solo_paginas }}
    runs-on: ubuntu-latest
    # Permiso para hacer push del JSON (la persistencia) al repositorio.
    permissions:
      contents: write
    steps:
      # 1. Descarga el repositorio en la máquina de GitHub.
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2. Instala Python.
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala las librerías que necesita el pipeline.
      - name: Instalar librerías
        run: pip install -r requirements.txt

      # 4. Descarga el feed y clasifica (actualiza data/licitaciones.json).
      #    NECESITA la credencial de servicio para leer radar_config (la config del
      #    panel ⚙). Antes se leía con la clave pública, pero esa lectura se cierra
      #    al separar los perfiles. Si no puede leerla, el paso FALLA a propósito:
      #    publicar el radar con los criterios equivocados es peor que no publicarlo.
      - name: Recuperar las páginas bajadas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: paginas-feed
          path: paginas

      - name: Filtrar licitaciones
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          # Lee las páginas del job «descargar»; si no están, en vivo (feeds.descarga_entradas).
          RADAR_PAGINAS: paginas
        run: python filtrar.py

      # 5. Regenera la web (docs/index.html) a partir del JSON.
      #    Misma credencial y mismo motivo: también lee radar_config.
      - name: Generar la web
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python generar_web.py

      # 6. Guarda SOLO la persistencia (data/licitaciones.json) con commit+push.
      #    docs/ ya NO se sube por push: lo publica el despliegue de Pages (job 2).
      #    Si el JSON no cambió, no hace nada (no ensucia el historial).
      - name: Guardar la persistencia (si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el JSON: no hay nada que guardar."
          else
            git commit -m "Actualización automática de la persistencia (data/licitaciones.json)"
            git push
          fi

      # 7. Empaqueta docs/ como artefacto para que el job de despliegue lo publique.
      - name: Subir docs/ como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # --- Job 2: publica el artefacto en GitHub Pages (método oficial) -----------
  desplegar:
    needs: generar
    runs-on: ubuntu-latest
    # Permisos que exige el despliegue oficial de Pages.
    permissions:
      pages: write
      id-token: write
    # Vincula el job al entorno "github-pages" y expone la URL publicada.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # --- Job 3: catálogo del BUSCADOR (independiente del Radar) -----------------
  # Ingesta incremental diaria del feed a public.licitaciones + purga de la ventana
  # de 3 años. Solo depende de «descargar» (sus páginas): corre EN PARALELO a
  # generar/desplegar, así que si falla NO impide que el Radar se publique.
  # NO toca data/licitaciones.json ni la
  # cortina de login: es otro destino (la base consultable del buscador en Supabase).
  catalogo:
    # En la ejecución automática de cada mañana (schedule) se hace SIEMPRE.
    # Lanzándolo a mano solo si se marca la casilla: probar un cambio de la web no
    # tiene por qué disparar una segunda ingesta y una segunda purga del día sobre
    # la base de producción.
    # Lee las páginas del job «descargar»; corre aunque ese job falle por un error
    # suyo (entonces lee en vivo, como antes).
    needs: descargar
    # Tampoco el sábado y el domingo (el cron "7 4 * * 0,6") ni con «solo_paginas».
    if: ${{ !cancelled() && github.event.schedule != '7 4 * * 0,6' && !inputs.solo_paginas && (github.event_name != 'workflow_dispatch' || inputs.ejecutar_catalogo) }}
    runs-on: ubuntu-latest
    # Solo lectura del repo (checkout). Las credenciales van por secrets, no por el repo.
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      # 1) Ingesta incremental: upsert de TODO el feed en vivo (estatal + agregadas).
      #    También puebla public.adjudicaciones (Fase D1) con las adjudicaciones que
      #    llegan cada día por el MISMO feed (delete+insert por expediente). Si la tabla
      #    aún no existe, ingiere el catálogo igual y solo salta las adjudicaciones.
      #    Fase D2: al terminar, hace el cruce CIF de LODEPA -> public.decisiones
      #    (RPC automarcar_ganadas_lodepa, idempotente) para auto-marcar las GANADAS.
      #    Si esa RPC no está desplegada, avisa y sigue (no rompe la ingesta).
      - name: Recuperar las páginas bajadas
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: paginas-feed
          path: paginas

      - name: Ingesta diaria al catálogo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          RADAR_PAGINAS: paginas
        run: python backfill_catalogo.py --diario

      # 2) Purga de la ventana de 3 años (requiere haber creado la función
      #    public.purga_catalogo con purga_catalogo.sql). Borra lo viejo salvo lo
      #    abierto, lo que esté en public.contratos y lo que esté en public.decisiones.
      - name: Purga de la ventana (3 años)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python backfill_catalogo.py --purgar --ventana-anios 3
